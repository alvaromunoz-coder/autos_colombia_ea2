name: autos_colombia_ea1
description: "Sistema de Información - Parqueadero Autos Colombia (EA1 Iteración 1)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependencia para la conexión con la base de datos de Supabase
  supabase_flutter: ^2.8.0

  # Iconos predeterminados de iOS/Material
  cupertino_icons: ^1.0.6
  excel: ^4.0.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Permite simular el almacenamiento local en las pruebas de Supabase
  shared_preferences: ^2.5.6

flutter:
  uses-material-design: true
